[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hida"
version = "3.0.0"
description = "CastXML XML → headers / Python code"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "gooznick" }]
dependencies = []  # add your runtime deps here

[project.optional-dependencies]
gui = [
  "PyQt6>=6.5",
  # optional nice-to-haves:
  # "PyQt6-Qt6>=6.5", "PyQt6-Qt6-Plugins", "qdarkstyle"
]

[project.scripts]
hida-castxml = "hida.castxml_cli:main"
hida = "hida.cli:main"
hida-gui = "hida.cli_gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Include the embedded Windows binary
[tool.setuptools.package-data]
hida = ["bin/castxml.exe"]